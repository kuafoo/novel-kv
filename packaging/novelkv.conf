# NovelKV Configuration
# Read by systemd (EnvironmentFile). After editing, run:
#   sudo systemctl restart novelkv
#
# All options go into NOVELKV_OPTS as CLI arguments.
# Run 'novelkv --help' for full usage.

# === Standalone Mode (default) ===
NOVELKV_OPTS="--host 0.0.0.0 --port 6379 --data /var/lib/novelkv --log-level info --disable-dangerous"

# === Production with authentication ===
# NOVELKV_OPTS="--host 0.0.0.0 --port 6379 --data /var/lib/novelkv --log-level info --disable-dangerous --requirepass CHANGE-ME"

# === TLS encryption ===
# NOVELKV_OPTS="--host 0.0.0.0 --port 6379 --data /var/lib/novelkv --log-level info --disable-dangerous --tls-cert /etc/novelkv/certs/server.pem --tls-key /etc/novelkv/certs/server-key.pem --tls-ca /etc/novelkv/certs/ca.pem"

# === Replica mode ===
# NOVELKV_OPTS="--host 0.0.0.0 --port 6379 --data /var/lib/novelkv --log-level info --replicaof master-host 6379 --masterauth master-password"

# === TLS replica with authentication ===
# NOVELKV_OPTS="--host 0.0.0.0 --port 6379 --data /var/lib/novelkv --log-level info --disable-dangerous --requirepass CHANGE-ME --tls-cert /etc/novelkv/certs/server.pem --tls-key /etc/novelkv/certs/server-key.pem --replicaof master-host 6379 --masterauth master-password --tls-replica"
