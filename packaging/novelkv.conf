# NovelKV Configuration File
# Redis conf style: key value per line, # comments
#
# Load with: novelkv --config /etc/novelkv/novelkv.conf
# CLI arguments override config file values.
# Run 'novelkv --help' for full usage.

# === Server ===
host 0.0.0.0
port 6379
data /var/lib/novelkv
log-level info
disable-dangerous yes
# requirepass CHANGE-ME

# === TLS ===
# tls-cert /etc/novelkv/certs/server.pem
# tls-key /etc/novelkv/certs/server-key.pem
# tls-ca /etc/novelkv/certs/ca.pem
# tls-replica no

# === Replication ===
# replicaof master-host 6379
# masterauth master-password

# === HTTP Chapter API ===
# http-port 8080
# http-secret CHANGE-ME
# http-sign-ttl 3600
# http-rate-burst 30
# http-rate-refill 10

# === Storage Tuning ===
# write-buffer-size 64mb
# block-size 128kb
# compression-level 9
# bloom-bits 10
